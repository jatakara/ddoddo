services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archcenter
      POSTGRES_USER: archcenter
      POSTGRES_PASSWORD: archcenter
    volumes:
      - archcenter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archcenter -d archcenter"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://archcenter:archcenter@db:5432/archcenter
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-at-least-32-bytes}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMeNow!}
    depends_on:
      db:
        condition: service_healthy

volumes:
  archcenter_pgdata:
