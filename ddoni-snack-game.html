<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff7ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>또니 간식 타임</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(180deg,#fff7ed 0%,#fffdf5 58%,#eef6ff 100%);color:#252525}
.app{width:min(100vw,430px);height:100svh;margin:0 auto;padding:max(7px,env(safe-area-inset-top)) 12px max(7px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:7px;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.title{font-size:20px;font-weight:950}.back{background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:8px 11px;text-decoration:none;color:#333;font-weight:850;font-size:12px}
.hud{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;gap:5px}
.hud div{background:rgba(255,255,255,.9);border:1px solid #f0e4d8;border-radius:13px;text-align:center;padding:6px 2px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.hud b{display:block;font-size:14px;white-space:nowrap}.hud span{font-size:9px;color:#7c6f64}
.levelBadge{background:linear-gradient(180deg,#fff7cc,#ffe89b)!important;border-color:#f5d76e!important}
.scene{min-height:0;background:rgba(255,255,255,.82);border:1px solid #f0e4d8;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:7px 10px;box-shadow:0 16px 35px rgba(145,91,32,.10)}
.dog{transition:transform .18s}.dogphoto{width:clamp(132px,38vw,180px);height:clamp(150px,43vw,205px);object-fit:cover;object-position:center 42%;display:block;border-radius:22px;border:4px solid #fff;box-shadow:0 10px 24px rgba(93,62,33,.16)}
.dog.happy{animation:happy .45s ease}.dog.nope{animation:nope .35s ease}
@keyframes happy{0%,100%{transform:scale(1)}35%{transform:scale(1.1) rotate(-4deg)}70%{transform:scale(1.08) rotate(4deg)}}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.spark{position:absolute;font-size:20px;animation:pop .65s ease-out forwards;pointer-events:none}
@keyframes pop{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-65px) scale(1.35)}}
.bubble{margin-top:5px;background:#fff;border:2px solid #f1dcc7;border-radius:18px;padding:7px 12px;font-weight:900;font-size:12px;min-height:34px;display:flex;align-items:center;justify-content:center;text-align:center}
.foodcard{margin-top:7px;width:min(92%,310px);background:#fff;border:1px solid #eee;border-radius:19px;padding:8px 12px;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.07)}
.foodemoji{font-size:clamp(42px,13vw,58px);line-height:1.05}.foodname{font-size:20px;font-weight:950;margin-top:3px}.hint{font-size:10px;color:#8a7d72;margin-top:3px;min-height:14px}.question{font-size:12px;font-weight:850;color:#5d5148;margin-top:5px}
.timerWrap{width:min(90%,290px);height:7px;background:#eee7df;border-radius:99px;overflow:hidden;margin-top:6px;display:none}
.timerBar{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#facc15,#ef4444);transform-origin:left center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{border:0;border-radius:18px;min-height:56px;font:inherit;font-weight:950;font-size:16px;color:#fff;touch-action:manipulation}
.yes{background:linear-gradient(180deg,#22c55e,#16a34a)}.no{background:linear-gradient(180deg,#fb7185,#e11d48)}
.actions button:active{transform:scale(.98)}
.progress{height:8px;background:#fff;border-radius:99px;overflow:hidden;border:1px solid #eee}.bar{height:100%;width:0;background:linear-gradient(90deg,#fb923c,#facc15);transition:width .25s}
.note{text-align:center;font-size:9px;color:#8b7f76;line-height:1.25}
.overlay{position:fixed;inset:0;background:rgba(36,27,20,.66);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay.show{display:flex}.modal{width:min(100%,360px);background:#fff;border-radius:24px;padding:20px;text-align:center;box-shadow:0 20px 55px rgba(0,0,0,.22);max-height:88svh;overflow:auto}
.big{font-size:56px}.modal h2{margin:6px 0}.modal p{color:#6b625b;line-height:1.45;font-size:13px}
.modal button{width:100%;border:0;border-radius:15px;padding:12px;margin-top:8px;font-weight:950;font-size:15px}
.primary{background:#f97316;color:#fff}.secondary{background:#f3f4f6;color:#333}.stageList{display:grid;gap:8px;text-align:left;margin-top:12px}
.stageBtn{width:100%;border:1px solid #eee;background:#fff;border-radius:16px;padding:12px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px}
.stageBtn.locked{opacity:.45}.stageBtn .sname{font-weight:950}.stageBtn .sdesc{font-size:10px;color:#7d746d;margin-top:2px}.stageNum{font-size:22px;font-weight:950}
.combo{position:absolute;right:14px;top:12px;background:#111827;color:#fff;border-radius:99px;padding:6px 9px;font-size:11px;font-weight:900;display:none}
@media(max-height:720px){
 .app{gap:4px;padding-top:max(4px,env(safe-area-inset-top));padding-bottom:max(4px,env(safe-area-inset-bottom))}
 .title{font-size:17px}.back{padding:6px 9px}.hud div{padding:4px 2px}.hud b{font-size:12px}
 .dogphoto{width:118px;height:136px;border-radius:18px}.bubble{padding:4px 9px;min-height:28px;font-size:10px}.foodcard{margin-top:4px;padding:6px 9px}
 .foodemoji{font-size:38px}.foodname{font-size:17px}.question{font-size:10px;margin-top:3px}.hint{font-size:9px}
 .actions button{min-height:46px;font-size:14px}.note{display:none}
}
</style>
</head>

  $("bar").style.width=(idx/st.rounds*100)+"%";
  $("combo").style.display=(st.combo&&combo>=2)?"block":"none";
  $("combo").textContent="🔥 COMBO "+combo;
}
function showFood(){
  clearTimer();
  const st=stages[level-1];
  if(idx>=st.rounds||hearts<=0)return finish();
  const f=deck[idx];
  $("emoji").textContent=f.e;$("name").textContent=f.n;
  $("hint").textContent= level>=2 ? (idx%2===0?"힌트 없음! 또니를 지켜줘 🐾":f.h) : f.h;
  $("bubble").textContent="또니에게 줘도 될까?";
  locked=false;updateHud();
  if(st.time>0) startTimer(st.time);
  else $("timerWrap").style.display="none";
}
function startTimer(sec){
  $("timerWrap").style.display="block";
  timerStart=Date.now();
  $("timerBar").style.width="100%";
  clearInterval(timer);
  timer=setInterval(()=>{
    const left=Math.max(0,1-(Date.now()-timerStart)/(sec*1000));
    $("timerBar").style.width=(left*100)+"%";
    if(left<=0){clearTimer();timeout();}
  },40);
}
function clearTimer(){if(timer){clearInterval(timer);timer=null}}
function timeout(){
  if(locked)return;
  locked=true;hearts--;combo=0;
  $("bubble").textContent="⏰ 시간 초과! 다음엔 더 빨리!";
  animateDog(false);sparkle("⏰");
  idx++;updateHud();setTimeout(showFood,750);
}
function sparkle(text){
  const s=document.createElement("div");s.className="spark";s.textContent=text;
  s.style.left=(25+Math.random()*50)+"%";s.style.top=(38+Math.random()*20)+"%";
  $("scene").appendChild(s);setTimeout(()=>s.remove(),700);
}
function animateDog(ok){
  const dog=$("dog");
  dog.classList.remove("happy","nope");void dog.offsetWidth;
  dog.classList.add(ok?"happy":"nope");
}
function choose(give){
  if(locked)return;locked=true;clearTimer();
  const f=deck[idx],ok=(give===f.ok),st=stages[level-1];
  if(ok){
    correct++;combo++;
    let add=10;
    if(st.combo&&combo>=2)add+=Math.min(10,(combo-1)*2);
    score+=add;
    $("bubble").textContent=f.msg+(add>10?"  +"+add+"점!":"");
    animateDog(true);sparkle(st.combo&&combo>=3?"🔥":"💖");
  }else{
    hearts--;combo=0;
    $("bubble").textContent=f.ok?"앗! 이건 소량은 먹어도 돼.":"앗! "+f.n+"은(는) 또니에게 위험해!";
    animateDog(false);sparkle("💥");
  }
  idx++;updateHud();setTimeout(showFood,780);
}
function finish(){
  clearTimer();
  const st=stages[level-1],cleared=correct>=st.need&&hearts>0;
  if(score>(bestBy[level]||0)){bestBy[level]=score;localStorage.setItem("ddoniBestByLevel",JSON.stringify(bestBy))}
  if(cleared&&level<stages.length&&unlocked<level+1){
    unlocked=level+1;localStorage.setItem("ddoniUnlockedLevel",String(unlocked));
  }
  $("resultEmoji").textContent=cleared?(level===5?"👑🐶":"🏆🐶"):"🐾";
  $("resultTitle").textContent=cleared?(level===5?"또니 마스터 완성!":"LV."+level+" 클리어!"):"조금만 더!";
  $("resultText").innerHTML=
    stages[level-1].name+"<br><b>"+correct+"/"+st.rounds+" 정답 · "+score+"점</b><br>"+
    (cleared?(level<5?"다음 레벨이 열렸어! 난이도가 올라간다 🔥":"모든 레벨을 정복했어! 🎉"):
    "클리어 조건은 "+st.need+"개 이상 정답이야.");
  $("nextBtn").style.display=(cleared&&level<5)?"block":"none";
  $("resultOverlay").classList.add("show");
  updateHud();
}
$("yes").addEventListener("click",()=>choose(true));
$("no").addEventListener("click",()=>choose(false));
$("retryBtn").addEventListener("click",()=>startLevel(level));
$("nextBtn").addEventListener("click",()=>startLevel(level+1));
$("stagesBtn").addEventListener("click",showStages);

document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});
document.addEventListener("touchstart",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
let lastTouch=0;document.addEventListener("touchend",e=>{const n=Date.now();if(n-lastTouch<300)e.preventDefault();lastTouch=n},{passive:false});

showStages();
})();
</script>
</body>
</html>
