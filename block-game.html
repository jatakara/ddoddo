<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>블록 게임</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#0f172a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;display:flex;justify-content:center;min-height:100vh}.wrap{width:min(100%,440px);padding:12px 12px calc(18px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.top b{font-size:22px}.back,button{border:0;border-radius:13px;background:#1e293b;color:#fff;padding:11px 13px;font-weight:800;text-decoration:none}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:9px}.stat{background:#111827;border:1px solid #293548;border-radius:12px;text-align:center;padding:8px 4px}.stat strong{display:block;font-size:18px}.stat small{color:#94a3b8}canvas{width:100%;aspect-ratio:1/2;background:#050914;border:1px solid #293548;border-radius:14px;display:block}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:9px}.controls button{font-size:22px;min-height:54px}.drop{background:#6d28d9}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.note{text-align:center;color:#94a3b8;font-size:11px;margin-top:8px;line-height:1.5}.over{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:25px}.over.show{display:flex}.box{background:#111827;border:1px solid #334155;border-radius:20px;padding:24px;text-align:center;max-width:320px;width:100%}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><b>🧱 블록 게임</b><a class="back" href="./">← 돌아가기</a></div>
<div class="hud">
<div class="stat"><strong id="score">0</strong><small>점수</small></div>
<div class="stat"><strong id="lines">0</strong><small>라인</small></div>
<div class="stat"><strong id="level">1</strong><small>레벨</small></div>
<div class="stat"><strong id="best">0</strong><small>최고</small></div>
</div>
<canvas id="c" width="300" height="600"></canvas>
<div class="controls">
<button id="l">◀</button><button id="r">↻</button><button id="rr">▶</button><button id="d">▼</button><button id="drop" class="drop">⤓</button>
</div>
<div class="bottom"><button id="pause">⏸ 일시정지</button><button id="new">↻ 새 게임</button></div>
<div class="note">가로줄을 채우면 사라져요 · ← → 이동 · ↻ 회전 · ⤓ 즉시 낙하</div>
</div>
<div id="over" class="over"><div class="box"><h2>게임 오버</h2><p id="final"></p><button id="again" class="drop">다시 시작</button></div></div>
<script>
(function(){
const cv=document.getElementById("c"),x=cv.getContext("2d"),W=10,H=20,S=30;
const C=["","#22d3ee","#facc15","#a78bfa","#4ade80","#fb7185","#60a5fa","#fb923c"];
const P=[[[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[0,4,4],[4,4,0]],[[5,5,0],[0,5,5]],[[6,0,0],[6,6,6]],[[0,0,7],[7,7,7]]];
let b,p,sc=0,ln=0,lv=1,best=+localStorage.getItem("ddoddoBlockBest")||0,last=0,acc=0,paused=false,dead=false;
document.getElementById("best").textContent=best;
function empty(){return Array.from({length:H},()=>Array(W).fill(0))}
function piece(){let i=Math.floor(Math.random()*P.length);return{m:P[i].map(r=>r.slice()),x:Math.floor((W-P[i][0].length)/2),y:0,id:i+1}}
function hit(q){for(let y=0;y<q.m.length;y++)for(let z=0;z<q.m[y].length;z++)if(q.m[y][z]){let yy=q.y+y,xx=q.x+z;if(xx<0||xx>=W||yy>=H||(yy>=0&&b[yy][xx]))return true}return false}
function spawn(){p=piece();if(hit(p)){dead=true;saveBest();document.getElementById("final").textContent="최종 점수 "+sc.toLocaleString()+"점";document.getElementById("over").classList.add("show")}}
function merge(){p.m.forEach((r,y)=>r.forEach((v,z)=>{if(v&&p.y+y>=0)b[p.y+y][p.x+z]=p.id}))}
function clear(){let n=0;outer:for(let y=H-1;y>=0;y--){for(let z=0;z<W;z++)if(!b[y][z])continue outer;b.splice(y,1);b.unshift(Array(W).fill(0));n++;y++}if(n){sc+=([0,100,300,500,800][n]||1200)*lv;ln+=n;lv=Math.floor(ln/10)+1;hud()}}
function lock(){merge();clear();spawn()}
function move(dx){if(paused||dead)return;p.x+=dx;if(hit(p))p.x-=dx}
function down(){if(paused||dead)return;p.y++;if(hit(p)){p.y--;lock()}else sc++;acc=0;hud()}
function drop(){if(paused||dead)return;let n=0;for(;;){p.y++;if(hit(p)){p.y--;break}n++}sc+=n*2;lock();hud()}
function rot(){if(paused||dead)return;let old=p.m.map(r=>r.slice()),ox=p.x;p.m=p.m[0].map((_,i)=>p.m.map(r=>r[i]).reverse());for(let k of [0,1,-1,2,-2]){p.x=ox+k;if(!hit(p))return}p.m=old;p.x=ox}
function hud(){document.getElementById("score").textContent=sc.toLocaleString();document.getElementById("lines").textContent=ln;document.getElementById("level").textContent=lv;if(sc>best){best=sc;document.getElementById("best").textContent=best}}
function saveBest(){let old=+localStorage.getItem("ddoddoBlockBest")||0;if(sc>old)localStorage.setItem("ddoddoBlockBest",sc)}
function cell(a,y,id){x.fillStyle=C[id];x.fillRect(a*S+1,y*S+1,S-2,S-2)}
function draw(){x.fillStyle="#050914";x.fillRect(0,0,300,600);x.strokeStyle="#132036";for(let i=0;i<=W;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,600);x.stroke()}for(let i=0;i<=H;i++){x.beginPath();x.moveTo(0,i*S);x.lineTo(300,i*S);x.stroke()}b.forEach((r,y)=>r.forEach((v,z)=>v&&cell(z,y,v)));if(p)p.m.forEach((r,y)=>r.forEach((v,z)=>v&&p.y+y>=0&&cell(p.x+z,p.y+y,p.id)))}
function speed(){return Math.max(120,800-(lv-1)*60)}
function loop(t){let dt=t-last;last=t;if(!paused&&!dead){acc+=dt;if(acc>speed())down()}draw();requestAnimationFrame(loop)}
function reset(){b=empty();sc=0;ln=0;lv=1;paused=false;dead=false;acc=0;document.getElementById("over").classList.remove("show");document.getElementById("pause").textContent="⏸ 일시정지";hud();spawn()}
function pause(){if(dead)return;paused=!paused;document.getElementById("pause").textContent=paused?"▶ 계속":"⏸ 일시정지"}
document.getElementById("l").onclick=()=>move(-1);document.getElementById("rr").onclick=()=>move(1);document.getElementById("d").onclick=down;document.getElementById("r").onclick=rot;document.getElementById("drop").onclick=drop;document.getElementById("pause").onclick=pause;document.getElementById("new").onclick=reset;document.getElementById("again").onclick=reset;
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);else if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowDown")down();else if(e.key==="ArrowUp")rot();else if(e.key===" ")drop()});
reset();requestAnimationFrame(loop);
})();
</script></body></html>
