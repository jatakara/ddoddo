services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archcenter
      POSTGRES_USER: archcenter
      POSTGRES_PASSWORD: archcenter
    volumes:
      - archcenter_v4_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archcenter -d archcenter"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://archcenter:archcenter@db:5432/archcenter
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-admin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-sol}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-ac-v4.1-2026-10-02}
    depends_on:
      db:
        condition: service_healthy
volumes:
  archcenter_v4_pgdata:
